; =============================================================================
; CONFIGURAÇÃO DO PHP PARA PRODUÇÃO (LMS)
; =============================================================================
; Copie este arquivo ou adicione estas diretivas ao seu php.ini de produção.
; Se estiver usando Docker, copie-o para: /usr/local/etc/php/conf.d/
; =============================================================================

[PHP]
; -----------------------------------------------------------------------------
; Limites de Upload (Essencial para uploads de aulas, materiais e evidências)
; -----------------------------------------------------------------------------
upload_max_filesize = 100M
post_max_size = 100M

; -----------------------------------------------------------------------------
; Recursos e Tempo de Execução
; -----------------------------------------------------------------------------
memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; -----------------------------------------------------------------------------
; Exibição de Erros e Logs (Segurança)
; -----------------------------------------------------------------------------
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; -----------------------------------------------------------------------------
; Configurações Adicionais de Segurança
; -----------------------------------------------------------------------------
expose_php = Off                ; Oculta a versão do PHP no cabeçalho HTTP
session.cookie_httponly = On    ; Impede acesso a cookies de sessão via Javascript
session.cookie_secure = On      ; Exige conexão HTTPS para os cookies de sessão
session.use_only_cookies = On   ; Evita ataques de fixação de sessão

[opcache]
; -----------------------------------------------------------------------------
; Performance OPcache (Altamente Recomendado para Produção no Laravel)
; -----------------------------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.max_wasted_percentage = 10
opcache.validate_timestamps = 0 ; 0 melhora a performance, mas exige reiniciar o PHP-FPM ao atualizar o código.
opcache.revalidate_freq = 0
opcache.save_comments = 1        ; Exigido pelo Laravel para anotações e injeção de dependências
