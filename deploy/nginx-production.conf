server {
    listen 80;
    listen [::]:80;
    server_name lms.suaempresa.com;
    
    # Redirecionamento permanente para HTTPS (Boas Práticas de Segurança)
    return 301 https://$server_name$request_uri;
}

server {
    listen 444 ssl http2;
    listen [::]:444 ssl http2;
    server_name lms.suaempresa.com;

    # Caminho absoluto da pasta public do Laravel (Vínculo do document root)
    root /var/www/lms/public;
    index index.php;

    # Configurações do Certificado SSL (Let's Encrypt / Certbot como exemplo)
    ssl_certificate /etc/letsencrypt/live/lms.suaempresa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lms.suaempresa.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Cabeçalhos de Segurança (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "upgrade-insecure-requests; block-all-mixed-content;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    charset utf-8;

    # Roteamento padrão do Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Desativa gravação de logs desnecessários para robots e favicon
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Página de Erro de Upload / Tamanho Máximo
    client_max_body_size 100M;

    # Processamento PHP via PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # Ajuste para a versão ativa do PHP
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Bloqueio de arquivos ocultos e do Git
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Cache de arquivos estáticos de mídia/assets do Vite (CSS, JS, Imagens, Fontes)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, no-transform, max-age=31536000";
    }

    # Compactação Gzip para acelerar o carregamento da aplicação
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";
}
